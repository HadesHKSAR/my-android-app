name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      # 1. 取得專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝 Buildozer 所需的系統依賴套件（使用 ubuntu-22.04 原生支援的源）
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
              cmake libffi-dev libssl-dev build-essential

      # 4. 升級 pip 並安裝 Cython 與 Buildozer
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      # 5. 執行 Buildozer 打包 Android Debug APK
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # 6. 上傳產出的 APK 檔案供下載
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
