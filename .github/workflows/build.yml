name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕觸發打包

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      # 1. 取得專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝系統依賴
      - name: Install System Dependencies
        run: |
          echo "=== 停止背景自動更新，釋放 apt 鎖 ==="
          sudo systemctl stop unattended-upgrades || true
          sudo killall apt apt-get dpkg || true
          
          echo "=== 啟用 universe 庫並更新套件 ==="
          sudo add-apt-repository universe -y
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          
          echo "=== 開始安裝系統依賴 ==="
          sudo apt-get install -y --no-install-recommends \
              git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
              cmake libffi-dev libssl-dev build-essential

      # 4. 升級 pip 並安裝 Cython 與 Buildozer
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      # 5. 【自動化核心】每次構建自動將版本號 +0.1
      - name: Auto Increment Version
        run: |
          python -c "
          import re
          with open('buildozer.spec', 'r', encoding='utf-8') as f:
              content = f.read()
          
          match = re.search(r'^version\s*=\s*(.*)', content, re.M)
          if match:
              old_ver = match.group(1).strip()
              print(f'當前版本號: {old_ver}')
              try:
                  parts = old_ver.split('.')
                  major = int(parts[0])
                  minor = int(parts[1]) + 1
                  if minor >= 10:
                      major += 1
                      minor = 0
                  new_ver = f'{major}.{minor}'
              except:
                  new_ver = '1.1'
              
              content = content.replace(match.group(0), f'version = {new_ver}')
              with open('buildozer.spec', 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'已自動更新版本號為: {new_ver}')
          "

      # 6. 執行 Buildozer 打包 Android Debug APK
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # 7. 上傳產出的 APK 檔案供下載
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
