name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      # 1. 取得專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 修正後的系統依賴安裝（加入 universe 庫支援以避免套件找不到）
      - name: Install System Dependencies
        run: |
          echo "=== 停止背景自動更新，釋放 apt 鎖 ==="
          sudo systemctl stop unattended-upgrades || true
          sudo killall apt apt-get dpkg || true
          
          echo "=== 啟用 universe 庫並更新套件 ==="
          sudo add-apt-repository universe -y
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          
          echo "=== 開始安裝系統依賴 ==="
          sudo apt-get install -y --no-install-recommends \
              git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
              cmake libffi-dev libssl-dev build-essential

      # 4. 升級 pip 並安裝 Cython 與 Buildozer
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      # 5. 執行 Buildozer 打包 Android Debug APK
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # 6. 上傳產出的 APK 檔案供下載
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
